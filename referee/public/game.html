<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canon Stampede · canon.rodeo</title>
<meta name="description" content="Ride a stampede of agents' changes for 40 seconds reviewing every change yourself, then 40 the Canon way, and feel the difference.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#010e20">
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("canon-theme"); } catch {}
    document.documentElement.dataset.theme = saved ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..800&family=Archivo:ital,wdth,wght@0,100..125,400..700;1,100..125,400..600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/music.js" defer></script>
<script src="/stampede.js" defer></script>
<style>
  /* The same tokens as the main page (index.html). */
  :root {
    --bg: #010e20; --panel: rgb(8 28 54 / 0.72); --panel-solid: #071a33;
    --ink: #f5efe6; --ink-2: #c9c3ba; --muted: #8796ab; --line: rgb(135 150 171 / 0.18); --line-2: rgb(135 150 171 / 0.32);
    --brand: #fd6f16; --brand-2: #ed5616; --gold: #fdc86d; --held: #4cc38a; --broke: #ff6b86; --pending: #fdc86d;
    --display: "Big Shoulders Display", "Archivo", sans-serif; --sans: "Archivo", system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace;
  }
  :root[data-theme="light"] {
    --bg: #fbf6ef; --panel: rgb(255 255 255 / 0.8); --panel-solid: #ffffff;
    --ink: #01132a; --ink-2: #2a3a52; --muted: #5b6577; --line: rgb(1 19 42 / 0.10); --line-2: rgb(1 19 42 / 0.2);
    --brand: #ed5616; --brand-2: #c2410c; --gold: #b7791f; --held: #1e7b4f; --broke: #c0264e; --pending: #b7791f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { color: var(--ink); font: 15px/1.55 var(--sans); -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; padding-bottom: 10px; }
  .bar a { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 24px/1 var(--display); text-transform: uppercase; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
  .brand img { width: 34px; height: 34px; filter: drop-shadow(0 6px 14px rgb(253 111 22 / 0.45)); }
  .brand .tld { color: var(--brand); }
  .close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-size: 16px;
    background: var(--panel); border: 1px solid var(--line-2); backdrop-filter: blur(10px); }
  .close:hover { color: var(--brand); border-color: var(--brand); }
  .top { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hud { width: 100%; display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; }
  .round { display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
  .round b { font: 800 24px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .round-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .secs { font: 600 15px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .secs.low { color: var(--broke); }
  .time { display: block; height: 3px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
  .time i { display: block; height: 100%; width: 100%; background: var(--brand); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 12px var(--mono); color: var(--ink-2); }
  .stats b { color: var(--ink); font-weight: 500; }
  .stats .bad { color: var(--broke); } .stats .good { color: var(--held); } .stats .auto { color: var(--brand); }
  /* Bottom centre, below the herd. */
  .auto-btn { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: auto; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 9px; font: 600 15px var(--sans); color: var(--ink); cursor: pointer;
    background: var(--panel); border: 1px solid var(--brand); border-radius: 999px; padding: 12px 20px; backdrop-filter: blur(10px); box-shadow: 0 12px 30px -16px rgb(0 0 0 / .6); }
  .auto-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .auto-btn.git { color: var(--muted); border-color: var(--line-2); }
  .auto-btn.git::before { background: var(--muted); }
  .auto-btn.on { color: #1a0b02; border-color: transparent; background: linear-gradient(180deg, #fdac5c, var(--brand) 55%, var(--brand-2)); }
  .auto-btn.on::before { background: #1a0b02; animation: blink 1s infinite; }
  .auto-btn[hidden] { display: none; }
  @keyframes blink { 50% { opacity: .25; } }
  /* Tips stack just above the horizon (top is set from the canvas layout), newest nearest it, one sentence per line. */
  .tips { position: absolute; left: 50%; transform: translate(-50%, -100%); width: max-content; max-width: min(760px, calc(100% - 32px));
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .tip { margin: 0; text-align: center; font: 500 14.5px/1.45 var(--sans); background: var(--panel); border: 1px solid var(--line-2); white-space: pre-line;
    border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(10px); opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
  .tip.on { opacity: 1; transform: none; }
  .card { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: min(580px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow: auto;
    pointer-events: auto; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 18px; padding: 26px 26px 22px; box-shadow: 0 30px 80px -30px rgb(0 0 0 / .6);
    -webkit-user-select: text; user-select: text; animation: rise .45s cubic-bezier(.2,.7,.1,1) both; }
  .card[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  .kicker { font: 500 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
  .card h3 { font: 800 clamp(30px, 4.4vw, 44px)/.95 var(--display); text-transform: uppercase; margin: 0 0 14px; }
  .card h3 em { font-style: normal; color: var(--brand); }
  .card p { color: var(--ink-2); margin: 0 0 10px; font-size: 15.5px; line-height: 1.5; text-wrap: pretty; }
  .card p b { color: var(--ink); font-weight: 600; }
  .card p.fine { font-size: 13px; color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 6px; font-size: 14.5px; color: var(--ink-2); }
  .legend > span { display: flex; align-items: center; gap: 10px; }
  .legend b { color: var(--ink); }
  .legend i { width: 14px; height: 14px; flex: none; background: repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 4px); }
  .legend kbd { flex: none; min-width: 52px; text-align: center; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brand);
    border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 5px 7px; }
  .legend .g { color: var(--held); } .legend .r { color: var(--broke); } .legend .a { color: var(--pending); }
  .pace { display: flex; align-items: center; gap: 4px; margin: 16px 0 0; }
  .pace span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
  .pace button { font: 600 13.5px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 13px; cursor: pointer; }
  .pace button:hover { color: var(--ink); border-color: var(--muted); }
  .pace button[aria-checked="true"] { color: var(--brand); border-color: var(--brand); background: rgb(253 111 22 / .12); }
  .pace + .pace { margin-top: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: 600 14.5px var(--sans); text-decoration: none; padding: 11px 18px; border-radius: 12px; border: 0; cursor: pointer; }
  .btn.primary { color: #1a0b02; background: linear-gradient(180deg, #fdac5c, var(--brand) 55%, var(--brand-2)); box-shadow: 0 12px 28px -12px rgb(253 111 22 / 0.9), inset 0 1px 0 rgb(255 255 255 / 0.35); }
  .ghost { display: inline-flex; align-items: center; font: 600 14.5px var(--sans); color: var(--ink); text-decoration: none; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; }
  .ghost:hover { border-color: var(--brand); color: var(--brand); }
  .vs { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 14.5px; }
  .vs th { font: 700 18px/1 var(--display); text-transform: uppercase; text-align: right; padding: 0 0 8px; color: var(--muted); }
  .vs th:last-child { color: var(--brand); }
  .vs td { padding: 8px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
  .vs td + td { text-align: right; font: 500 15px var(--mono); color: var(--ink); width: 120px; }
  .vs small { color: var(--muted); font: 400 11px var(--mono); display: block; }
  .vs .bad { color: var(--broke) !important; } .vs .good { color: var(--held) !important; }
  @media (max-width: 700px) {
    .round { min-width: 0; flex: 1; }
    .card { padding: 20px 18px 18px; top: 56%; }
    .card p { font-size: 14.5px; }
    .tip { font-size: 13.5px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Canon Stampede: tap an animal to lasso it"></canvas>
<div class="ui">
  <div class="bar wrap">
    <a class="brand" href="/" aria-label="canon.rodeo"><img src="/icon.png" alt=""><span>Canon<span class="tld">.rodeo</span></span></a>
    <a class="close" href="/" aria-label="Back to canon.rodeo" title="Back to canon.rodeo">✕</a>
  </div>
  <div class="top wrap">
    <div class="hud">
      <div class="round"><div class="round-top"><b data-r="round">Canon Stampede</b><span class="secs" data-r="secs"></span></div><span class="time"><i data-r="time"></i></span></div>
      <div class="stats" data-r="stats"></div>
    </div>
  </div>
  <div class="tips" data-r="tips" role="status" aria-live="polite"></div>
  <button class="auto-btn" data-r="auto" type="button" hidden>Turn on autopilot</button>
  <div class="card" data-r="card" hidden></div>
</div>
</body>
</html>
